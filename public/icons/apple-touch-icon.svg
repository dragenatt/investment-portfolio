<?xml version="1.0" encoding="UTF-8"?>
<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- iOS rounds the corners itself and fills transparency with black, so the
       background is a full square. -->
  <defs>
    <style>
      .bg { fill: #09090b; }
      .text { font-family: Arial, sans-serif; font-weight: bold; fill: #ffffff; font-size: 70px; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>
  <rect class="bg" width="180" height="180"/>
  <text class="text" x="90" y="90">IT</text>
</svg>
