name: Deploy worker

# The Cloudflare worker was deployed by hand, from a laptop, with an OAuth
# session that belongs to one person. Everything else in this repository ships
# on push; this did not, so the deployed scheduler and worker/src could drift
# apart with nothing to say they had.
#
# Only when the worker changes. A deploy creates a new version of it, and
# versions of an unchanged scheduler are noise.

on:
  push:
    branches: [master]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'

# A second push while one deploy is in flight waits for it rather than racing
# it: two wrangler deploys of the same worker decide the winner by arrival.
concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'

      # The root install is what typecheck:worker resolves its types from
      # (@cloudflare/workers-types is a root devDependency).
      - name: Install dependencies
        run: npm ci

      - name: TypeScript check (the worker)
        run: npm run typecheck:worker

      # Named before wrangler runs, so a missing token reads as configuration
      # rather than as an authentication failure nobody can act on.
      - name: Check the deploy is configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Worker deploy not configured::Add the repository secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions). Create it at Cloudflare > My Profile > API Tokens with the 'Edit Cloudflare Workers' template, scoped to this account. An account API token is used rather than a person's OAuth session, which cannot be scoped."
            exit 1
          fi

      - name: Install the worker's own dependencies
        working-directory: worker
        run: npm ci

      # Built and packaged before anything is uploaded: a dry run fails here on
      # a broken bundle or an unreadable wrangler.toml, without touching the
      # deployed worker.
      - name: Dry run
        working-directory: worker
        run: npx wrangler deploy --dry-run

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
