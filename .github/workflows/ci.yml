name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint -- --ignore-pattern ".claude/"

      - name: Run tests
        run: npm run test:run

      # Called out separately from the rest of the suite so a change to a
      # financial number is visible in the job list, not buried in 900 passing
      # tests. Every expectation in it is hand-derived — see the header of
      # tests/financial-regression/golden.test.ts before touching one.
      - name: Financial regression suite
        run: npm run test:financial

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The public half needs no secrets and runs on every push. The signed-in
      # half skips itself unless E2E_EMAIL and E2E_PASSWORD are configured — the
      # skip is reported rather than silent, so a green run never implies more
      # coverage than actually ran.
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_PORTFOLIO_ID: ${{ secrets.E2E_PORTFOLIO_ID }}

      - name: Upload the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
