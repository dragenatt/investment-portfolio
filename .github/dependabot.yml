# C7. Weekly dependency updates, grouped so they arrive as a few reviewable PRs
# instead of one per package. Security updates are not grouped or delayed:
# GitHub opens those as soon as an advisory is published, and CI's
# dependency-audit job fails until they are merged.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Next and its ESLint config move together, or lint breaks.
      next:
        patterns:
          - next
          - eslint-config-next
          - "@next/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      supabase:
        patterns:
          - "@supabase/*"
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - "@playwright/test"
          - jsdom
          - "@testing-library/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # No major version bumps in the weekly PRs. The first run opened eleven,
      # among them TypeScript 5 -> 7, ESLint 9 -> 10, lucide-react 0.x -> 1.x
      # and @types/node 20 -> 26 (the runtime is Node 20): each changes APIs or
      # rules and fails CI on its own. Majors get a deliberate upgrade. Security
      # fixes are not affected: GitHub raises those as Dependabot security
      # updates regardless of this list, and the dependency-audit job fails
      # until they land.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
