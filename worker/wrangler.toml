# InvestTracker scheduler: calls the app's price-alert route every 5 minutes.
# The name is the old "price engine" worker's, so a deploy replaces it.
name = "price-engine"
main = "src/index.ts"
compatibility_date = "2024-12-16"
account_id = "8b18281e7f5efd3d2dceef34f64184e4"

[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_URL = "https://project-tri0w.vercel.app"

# Secret, set once with `npx wrangler secret put CRON_SECRET` — the same value
# as CRON_SECRET in the Vercel project. Never written here.
